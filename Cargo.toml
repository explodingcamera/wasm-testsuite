[package]
name = "wasm-testsuite"
version = "0.7.4"
edition = "2024"
rust-version = "1.93"
description = "Generic test harness for WebAssembly Runtimes"
readme = "README.md"
repository = "https://github.com/explodingcamera/wasm-testsuite"
license = "Apache-2.0"
include = ["Cargo.toml", "data/**/*", "src/**/*"]

[workspace]
resolver = "3"
members = [".", "scripts"]
default-members = [".", "scripts"]

[dependencies]
include_dir = "0.7"
wast = { version = ">=245.0", optional = true }

[dev-dependencies]
eyre = "0.6"

[features]
default = ["wast"]

# Enable helpers for the `wast` crate. Can have breaking changes in patch releases.
wast = ["dep:wast"]
